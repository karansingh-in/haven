<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="manifest.json" />
    <!-- ?v=2 busts iOS's permanent per-URL cache of apple-touch-icon. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Haven" />
    <meta name="theme-color" content="#0B1220" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      react-native-web renders every Pressable as a div and never draws a focus
      ring, which leaves keyboard users (and iPadOS with a hardware keyboard)
      with no idea where they are. One visible ring, system blue, for every
      control.
    -->
    <style id="haven-focus">
      :focus-visible {
        outline: 3px solid #0a84ff;
        outline-offset: 2px;
        border-radius: 6px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
