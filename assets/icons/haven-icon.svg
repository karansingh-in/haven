<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D1B37"/>
      <stop offset="1" stop-color="#17101C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA8C6"/>
      <stop offset="1" stop-color="#FF6E9C"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- A doorway: one even stroke, open at the bottom. Centred on 512 in both
       axes once the round caps are counted, so it sits true in the square.
       Scaled to 0.85 to leave more room around it. -->
  <g transform="translate(512 512) scale(0.85) translate(-512 -512)">
    <path d="M 272 752 V 512 A 240 240 0 0 1 752 512 V 752" fill="none"
          stroke="url(#mark)" stroke-width="104" stroke-linecap="round"/>
  </g>
</svg>
