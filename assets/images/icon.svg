<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB1D4"/>
      <stop offset="50%" stop-color="#F06292"/>
      <stop offset="100%" stop-color="#C22760"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4ED"/>
      <stop offset="100%" stop-color="#FFB1D4"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB1D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Subtle glow -->
  <ellipse cx="512" cy="380" rx="300" ry="200" fill="url(#glowGrad)"/>

  <!-- Two interlocking shapes forming a heart/haven - representing two people + study focus -->
  <g transform="translate(512, 512)">
    <!-- Left curve (person 1) -->
    <path d="M -140 -20
             C -200 -20, -240 60, -200 140
             C -160 220, -60 280, 0 280
             C 20 280, 40 240, 40 180
             C 40 100, 0 20, -20 -20
             C -60 -20, -100 -20, -140 -20"
          fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

    <!-- Right curve (person 2) -->
    <path d="M 140 -20
             C 200 -20, 240 60, 200 140
             C 160 220, 60 280, 0 280
             C -20 280, -40 240, -40 180
             C -40 100, 0 20, 20 -20
             C 60 -20, 100 -20, 140 -20"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" opacity="0.95"/>

    <!-- Central timer/focus element - a subtle ring suggesting the 8-hour goal -->
    <circle cx="0" cy="80" r="68" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.35"/>
    <circle cx="0" cy="80" r="50" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"
            stroke-dasharray="314" stroke-dashoffset="78" stroke-linecap="round"
            transform="rotate(-90 0 80)"/>
  </g>

  <!-- Small sparkle accents -->
  <circle cx="280" cy="280" r="16" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="744" cy="280" r="12" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="240" cy="760" r="10" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="784" cy="760" r="14" fill="#FFFFFF" opacity="0.5"/>

  <!-- Tiny hearts as decorative dots -->
  <g fill="#FFFFFF" opacity="0.35">
    <path d="M 180 160 C 175 155, 165 155, 160 160 C 155 165, 155 175, 160 180 C 165 185, 175 185, 180 180 C 185 175, 185 165, 180 160" transform="scale(0.6 0.6)"/>
    <path d="M 844 160 C 839 155, 829 155, 824 160 C 819 165, 819 175, 824 180 C 829 185, 839 185, 844 180 C 849 175, 849 165, 844 160" transform="scale(0.5 0.5)"/>
  </g>
</svg>