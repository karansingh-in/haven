<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- iOS 26 Liquid Glass background - subtle glass morph -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0D1B2A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14213D" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#007AFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timerFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS icon mask radius = 224 for 1024) -->
  <rect width="1024" height="1024" rx="224" fill="url(#glassBg)"/>

  <!-- Subtle glass specular highlight (top edge) -->
  <path d="M0,224 C512,0 512,0 1024,224" fill="url(#glassHighlight)"/>

  <!-- Accent glow behind timer -->
  <ellipse cx="512" cy="360" rx="320" ry="180" fill="url(#accentGlow)"/>

  <!-- Timer ring (8h goal) - glassy stroke -->
  <g transform="translate(512, 512)">
    <!-- Track -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.12"/>
    <!-- Progress (8h = ~75% of day) -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#timerFill)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="1131" stroke-dashoffset="283"
            transform="rotate(-90 0 0)" opacity="0.95"/>
    <!-- Inner glow ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#007AFF" stroke-width="2" opacity="0.15"/>

    <!-- Central focus dot -->
    <circle cx="0" cy="0" r="28" fill="#007AFF" opacity="0.25"/>
    <circle cx="0" cy="0" r="16" fill="#007AFF" opacity="0.5"/>

    <!-- Subtle tick marks (4 quarters) -->
    <g stroke="#FFFFFF" stroke-width="3" opacity="0.18">
      <line x1="0" y1="-190" x2="0" y2="-210" transform="rotate(0)"/>
      <line x1="0" y1="-190" x2="0" y2="-210" transform="rotate(90)"/>
      <line x1="0" y1="-190" x2="0" y2="-210" transform="rotate(180)"/>
      <line x1="0" y1="-190" x2="0" y2="-210" transform="rotate(270)"/>
    </g>
  </g>

  <!-- Bottom specular catch (glass reflection) -->
  <ellipse cx="512" cy="860" rx="200" ry="40" fill="#FFFFFF" opacity="0.04"/>
</svg>