name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci
      # DST assertions only bite in a zone that observes DST; UTC would hide them.
      - run: npx jest tests/rollover.test.js --ci
        env:
          TZ: America/New_York
