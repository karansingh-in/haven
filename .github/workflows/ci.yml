name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # --forceExit: the react-test-renderer suites leave animations/timers
      # running, and Jest intermittently fails the run on a worker that will not
      # exit even though every test passed.
      - run: npx jest --ci --forceExit
      # DST assertions only bite in a zone that observes DST; UTC would hide them.
      - run: npx jest tests/rollover.test.js --ci --forceExit
        env:
          TZ: America/New_York
